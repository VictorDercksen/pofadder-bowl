name: Supabase migrations

# Manual fallback for applying supabase/migrations/ to the hosted project. The automatic path
# is Supabase's own GitHub integration (dashboard → Project Settings → Integrations), which
# pushes migrations when they land on main; this workflow exists for when that is unavailable
# or a push must be repeated. Run it from the Actions tab. The CLI only applies migrations
# missing from supabase_migrations.schema_migrations, so a rerun is a no-op. Vercel deploys
# the app in parallel; migrations must stay backward compatible with the previous deploy.
#
# Secrets come from the GitHub environment chosen at run time (Settings → Environments):
# "testing" (the Supabase project behind main) or "league" (the project behind production).
# Each environment holds its own three secrets; a repository-level secret of the same name
# is used when the environment does not define it.
#   SUPABASE_ACCESS_TOKEN  personal access token (Supabase account → Access Tokens)
#   SUPABASE_PROJECT_REF   the project ref (Project Settings → General)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which Supabase project to migrate"
        type: choice
        options:
          - testing
          - league
        default: testing
      dry_run:
        description: "Only list what would be applied"
        type: boolean
        default: false

concurrency:
  group: supabase-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the hosted project
        run: |
          echo "Target: ${{ inputs.target }} (project $SUPABASE_PROJECT_REF)"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pending migrations
        run: supabase migration list --linked

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase db push

      - name: Applied state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase migration list --linked
