name: Supabase migrations

# Applies pending files in supabase/migrations/ to the hosted project whenever a migration
# lands on main, so the schema no longer waits for a laptop `npm run db:push`.
# The CLI only applies migrations missing from supabase_migrations.schema_migrations, so a
# rerun is a no-op. Vercel deploys the app in parallel; migrations must therefore stay
# backward compatible with the previous deploy (the app's RPC fallbacks cover the gap).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (Supabase account → Access Tokens)
#   SUPABASE_PROJECT_REF   the project ref (Project Settings → General)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be applied"
        type: boolean
        default: false

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pending migrations
        run: supabase migration list --linked

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase db push

      - name: Applied state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase migration list --linked
